    <h1>Sushi Rice</h1>
    
    <img src="https://www.allrecipes.com/thmb/df3dPqkHbOhC5m9YJWvwtODmkVA=/750x0/filters:no_upscale():max_bytes(150000):strip_icc():format(webp)/99211-perfect-sushi-rice-DDMFS-4x3-3734ec6bd773431eac9953573a20bda1.jpg" alt="Cooked-Fluffy-Sushi-Rice" height="310" width="310">
    
    <h2>Description</h2>
    
    <p>A vinegared sushi rice cooked and very fluffy. Absolutely delicious to make any sushi.</p>

    <h3>Ingredients</h3>
    <ul>
      <li>2 cups uncooked sushi rice</li>
      <li>2 cups water</li>
      <li>1/4 cup rice wine vinegar or to taste</li>
      <li>1/4 cup white sugar or to taste</li>
      <li>1 tablespoon vegetable oil</li>
    </ul>
